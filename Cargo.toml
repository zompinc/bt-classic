[package]
name         = "bt-classic"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.88"
description  = "Bluetooth Classic (BR/EDR) host stack for no_std Rust: L2CAP, SDP and RFCOMM over HCI"
publish      = false

[features]
defmt = ["dep:defmt", "bt-hci/defmt", "embedded-io/defmt", "embedded-io-async/defmt"]
log   = ["dep:log", "bt-hci/log"]

[dependencies]
bt-hci            = { version = "0.11", default-features = false }
# Named by bt-hci's `cmd!` macro as `::bt_hci_transport`, so it must be a direct dependency.
bt-hci-transport  = "0.1"
defmt             = { version = "1", optional = true }
embedded-io       = "0.7"
embedded-io-async = "0.7"
log               = { version = "0.4", optional = true }

# The PC examples: HCI over TCP (rootcanal) through tokio.
[dev-dependencies]
bt-hci-serial        = "0.1"
critical-section     = { version = "1", features = ["std"] }
embassy-sync         = "0.8"
embedded-io-adapters = { version = "0.7", features = ["tokio-1"] }
tokio                = { version = "1", features = ["rt", "net", "macros", "io-util", "time"] }
